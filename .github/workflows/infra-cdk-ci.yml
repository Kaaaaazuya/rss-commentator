name: Infra CDK CI

on:
  push:
    paths:
      - 'infra/**'
      - '.github/workflows/infra-cdk-ci.yml'
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/infra-cdk-ci.yml'

jobs:
  cdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npx prettier --check .

      - name: Lint
        run: |
          if [ -f package.json ] && jq -e '.scripts["lint"]' package.json > /dev/null; then
            npm run lint
          else
            echo "No lint script defined, skipping."
          fi

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
