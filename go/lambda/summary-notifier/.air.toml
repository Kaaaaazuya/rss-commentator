root = "."

[build]
    bin = "./entry.sh ./tmp/main"
    cmd = "go build -o ./tmp/main ./cmd/main.go"
    include_ext = ["go"]
    exclude_dir = ["tmp"]
    exclude_unchanged = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true